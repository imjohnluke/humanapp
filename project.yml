name: HumanHydration
options:
  bundleIdPrefix: com.humanhydration
  deploymentTarget:
    iOS: "17.0"
packages: {}
settings:
  base:
    DEVELOPMENT_TEAM: DWFW94687C
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "4"
    MARKETING_VERSION: "1.0"
targets:
  HumanHydration:
    type: application
    platform: iOS
    info:
      path: HumanHydration/Info.plist
      properties:
        CFBundleDisplayName: Human Hydration
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSHealthUpdateUsageDescription: Human Hydration uses Health for optional routine insights. This version does not request permission to save or change your Health records.
        NSHealthShareUsageDescription: Use your workout history and optional sleep records to personalize hydration check-ins on this device.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.humanhydration.auth
            CFBundleURLSchemes:
              - humanhydration
    sources:
      - path: HumanHydration
        excludes:
          - Widgets/**
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.humanhydration.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: Human Hydration
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSHumanReadableCopyright: ""
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: "4"
      MARKETING_VERSION: "1.0"
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_ENTITLEMENTS: HumanHydration/HumanHydration.entitlements
    capabilities:
      SignInWithApple: {}
    dependencies:
      - target: HumanHydrationWidgets
        embed: true
  HumanHydrationWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HumanHydration/Widgets
      - path: HumanHydration/Shared
    info:
      path: HumanHydration/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Human Hydration
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.humanhydration.app.widgets
      INFOPLIST_KEY_CFBundleDisplayName: Human Hydration
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_ENTITLEMENTS: HumanHydration/Widgets/Widgets.entitlements
      APPLICATION_EXTENSION_API_ONLY: YES
      SKIP_INSTALL: YES
